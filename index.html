<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maker Fest CRM</title><link rel="stylesheet" href="style.css"></head><body><header><div><small>MIDDLESEX COUNTY MAKER FEST</small><h1>Organizer CRM</h1><p>Contacts, referrals and follow-ups</p></div><div><span id="role">Checking access…</span> <button id="login" hidden>Sign in</button><button id="logout" hidden>Sign out</button></div></header><main><p id="notice" role="status"></p><section id="auth" class="panel" hidden><h2>Organizer sign in</h2><form id="authForm"><label>Email <input type="email" id="email" required autocomplete="email"></label><label>Password <input type="password" id="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="workspace" hidden><div class="toolbar"><input id="search" placeholder="Search names, organizations, referrals…" aria-label="Search contacts"><select id="filter"><option value="">All statuses</option></select><button id="refresh">Refresh</button><button id="addStakeholder" type="button">Add Stakeholder</button></div><section id="newStakeholderPanel" class="panel" hidden><h2>Add stakeholder</h2><p>New stakeholders remain private until separately approved for public display.</p><form id="newStakeholderForm"><label>Name <input id="new_name" required maxlength="200"></label><label>Organization <input id="new_organization" maxlength="200"></label><label>Group / category <input id="new_category" value="Other" maxlength="120"></label><label>Recruitment status <input id="new_status" value="Research prospect" maxlength="120"></label><label>Potential contribution <textarea id="new_contribution"></textarea></label><label>Email (private) <input id="new_email" type="email"></label><div><button type="submit" id="createStakeholder">Save new stakeholder</button> <button type="button" id="cancelStakeholder">Cancel</button></div></form></section><div class="layout"><section class="panel"><h2>Stakeholders <span id="count"></span></h2><div id="list" class="list"></div></section><section class="panel"><h2 id="selectedName">Select a stakeholder</h2><form id="profileForm" hidden><label>Name <input id="person_name" required maxlength="200"></label><label>Organization <input id="organization" maxlength="200"></label><label>Group / category <input id="person_category" maxlength="120"></label><label>Recruitment status <input id="person_status" maxlength="120"></label><label>Potential contribution <textarea id="person_contribution"></textarea></label><label>Job title <input id="job_title"></label><label>Email <input id="contact_email" type="email"></label><label>Phone <input id="phone"></label><label>Website <input id="website"></label><label>Stakeholder types (comma-separated) <input id="stakeholder_types"></label><label>Interest area <input id="interest_area"></label><label>Priority <select id="priority"><option value="">Not set</option><option>High</option><option>Medium</option><option>Low</option></select></label><label>Referred by <input id="referred_by"></label><label>Relationship status <input id="relationship_status"></label><label>Participation status <input id="participation_status"></label><label>Last contact <input type="date" id="last_contact_date"></label><label>Next follow-up <input type="date" id="next_follow_up_date"></label><label>Next action <textarea id="next_action"></textarea></label><label>Requirements <textarea id="requirements"></textarea></label><button type="submit">Save CRM details</button></form><section id="activities" hidden><h3>Activity history</h3><div id="activityList"></div><form id="activityForm"><label>Type <select id="activity_type"><option>Email</option><option>Call</option><option>Meeting</option><option>Note</option></select></label><label>Summary <textarea id="activity_summary" required></textarea></label><label>Next step <input id="activity_next"></label><button>Add activity</button></form></section></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
